[package]
name = "opaml"
version = "0.1.0"
edition = "2021"
description = "A safety-first package manager for Liquid ecosystem projects"
license = "MIT"

[[bin]]
name = "opaml"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
